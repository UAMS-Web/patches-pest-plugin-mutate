# RUN_REMOTE_CI: budget kill-switch.
# The job below is gated on `if: vars.RUN_REMOTE_CI != 'false'`: with the variable set to
# `false` it reports `skipped` and consumes no runner minutes; unset, or any other value, runs
# it. Run `tests/check.sh` locally for the same check.
#
# This repository holds patches and no PHP source, so the shared uams-ci-workflows chain
# (lint, pest, mutate) has nothing to run. This is the one check that matters here.
name: Patches

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a change in the pinned upstream's dependencies that breaks the check shows
    # without a pull request.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  patches:
    name: Patches apply and the timeout patch fires
    runs-on: ubuntu-latest
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - run: bash tests/check.sh
